[build]
  command   = "echo ok"
  publish   = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Cron diário às 06:00 (horário Netlify = UTC-0, Brasil = -3)
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions."sync-acessorias"]
  schedule = "0 9 * * *"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
