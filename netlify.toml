[build]
  command   = "echo ok"
  publish   = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions."sync-acessorias"]
  schedule = "0 9 * * *"

# Netlify Functions ficam em /.netlify/functions/* — não redirecionar
[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — tudo mais vai para index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
